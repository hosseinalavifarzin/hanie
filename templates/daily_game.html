<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Daily Game</title>


    <!-- SAME BACKGROUND AS HOME -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/home.css') }}"
    >


    <!-- DAILY GAME STYLE -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/daily_game.css') }}"
    >

</head>


<body>


<main class="universe">


    <!-- =========================================
         COSMIC BACKGROUND
    ========================================== -->

    <div class="stars stars-small"></div>

    <div class="stars stars-medium"></div>

    <div class="stars stars-large"></div>


    <div class="galaxy galaxy-one"></div>

    <div class="galaxy galaxy-two"></div>


    <div class="ambient-glow"></div>


    <div id="shooting-stars"></div>


    <!-- =========================================
         DAILY GAME CONTENT
    ========================================== -->

    <section class="game-content">


        <!-- HEADER -->

        <header class="game-header">


            <a
                href="{{ url_for('home.home') }}"
                class="back-button"
            >
                ←
            </a>


            <div class="game-label">
                DAILY GAME
            </div>


            <span class="game-symbol">
                ✦
            </span>


        </header>



        <!-- INTRO -->

        <section class="game-intro">


            <span class="game-eyebrow">
                BEFORE YOU ENTER
            </span>


            <h1>
                {{ hint }}
            </h1>


            <p>
                کلمه مناسب را حدس بزن.
            </p>


        </section>



        <!-- GAME -->

        <section class="game-area">


            <!-- MESSAGE -->

            {% if message %}

            <div class="game-message">

                {{ message }}

            </div>

            {% endif %}



            <!-- GUESS FORM -->

            {% if not game_over %}

            <form
                method="POST"
                class="guess-form"
            >


                <input
                    type="text"
                    name="guess"
                    autocomplete="off"
                    autofocus
                    placeholder="جوابت..."
                >


                <button type="submit">

                    Guess

                    <span>
                        ↗
                    </span>

                </button>


            </form>

            {% endif %}



            <!-- GAME OVER -->

            {% if game_over %}

            <div class="game-over">


                <span>
                    TODAY'S GAME
                </span>


                <strong>
                    Game Over
                </strong>


            </div>

            {% endif %}



            <!-- ATTEMPTS -->

            <div class="game-stats">


                <div class="game-stat">


                    <span>
                        ATTEMPTS
                    </span>


                    <strong>
                        {{ attempts }} / {{ max_attempts }}
                    </strong>


                </div>


            </div>


        </section>



        <!-- FOOTER -->

        <footer class="game-footer">


            <span>
                made for two
            </span>


            <span>
                ✦
            </span>


            <span>
                2026
            </span>


        </footer>


    </section>


</main>



<!-- SAME SHOOTING STARS AS HOME -->

<script
    src="{{ url_for('static', filename='js/home.js') }}"
></script>


</body>

</html>
